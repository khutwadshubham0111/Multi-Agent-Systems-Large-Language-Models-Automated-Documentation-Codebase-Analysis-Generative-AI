<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentication | Multi-Agent AI Analyzer</title>
  <style>
    :root {
      --bg-1: #0b0f24;
      --bg-2: #141b3d;
      --panel: rgba(17, 24, 48, 0.85);
      --border: rgba(148, 163, 184, 0.22);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #4f46e5;
      --accent-grad: linear-gradient(135deg, #4f46e5, #7c3aed);
      --success: #22c55e;
      --error: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.28), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.28), transparent 40%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      padding: 20px;
    }

    .card {
      width: min(440px, 100%);
      padding: 36px 32px;
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(20px);
    }

    .brand-icon {
      font-size: 40px;
      text-align: center;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.85rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 22px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
    }

    form {
      display: grid;
      gap: 16px;
    }

    .form-group {
      display: grid;
      gap: 6px;
    }

    label {
      color: #cbd5e1;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.7);
      color: var(--text);
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
      cursor: pointer;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .remember-row span {
      font-size: 0.88rem;
      color: #cbd5e1;
    }

    .btn-submit {
      margin-top: 8px;
      border: none;
      border-radius: 11px;
      padding: 14px;
      background: var(--accent-grad);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
    }

    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      line-height: 1.4;
      display: none;
    }

    .alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .admin-hint {
      margin-top: 22px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px dashed rgba(148, 163, 184, 0.25);
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .admin-hint strong {
      color: #c7d2fe;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-icon">⚡</div>
    <h1>AI Codebase Analyzer</h1>
    <p class="subtitle">Multi-Agent Technical Documentation System</p>

    <div id="alertBox" class="alert"></div>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" method="post" action="/login">
      <div class="form-group">
        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" name="username" placeholder="Enter your username" required autofocus />
      </div>
      <div class="form-group">
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" name="password" placeholder="Enter your password" required />
      </div>

      <label class="remember-row">
        <input type="checkbox" id="rememberMe" name="remember" checked />
        <span>Remember my login info</span>
      </label>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" method="post" action="/register" style="display: none;">
      <div class="form-group">
        <label for="regUser">Choose Username</label>
        <input type="text" id="regUser" name="username" placeholder="Minimum 3 characters" required />
      </div>
      <div class="form-group">
        <label for="regPass">Password</label>
        <input type="password" id="regPass" name="password" placeholder="Minimum 4 characters" required />
      </div>
      <div class="form-group">
        <label for="regPassConfirm">Confirm Password</label>
        <input type="password" id="regPassConfirm" name="password_confirm" placeholder="Confirm password" required />
      </div>
      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div class="admin-hint">
      Default Admin: <strong>admin</strong> / <strong>admin123</strong>
    </div>
  </div>

  <script>
    const loginUserInput = document.getElementById('loginUser');
    const loginPassInput = document.getElementById('loginPass');
    const rememberMeCheck = document.getElementById('rememberMe');
    const loginForm = document.getElementById('loginForm');

    // Restore saved username if available
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('ai_analyzer_username');
      if (savedUser) {
        loginUserInput.value = savedUser;
        rememberMeCheck.checked = true;
        loginPassInput.focus();
      }
    });

    // Save login info on submit
    loginForm.addEventListener('submit', () => {
      if (rememberMeCheck.checked) {
        localStorage.setItem('ai_analyzer_username', loginUserInput.value.trim());
      } else {
        localStorage.removeItem('ai_analyzer_username');
      }
    });

    function switchTab(mode) {
      const loginTab = document.getElementById('tabLogin');
      const regTab = document.getElementById('tabRegister');
      const regForm = document.getElementById('registerForm');

      if (mode === 'register') {
        loginTab.classList.remove('active');
        regTab.classList.add('active');
        loginForm.style.display = 'none';
        regForm.style.display = 'grid';
        document.getElementById('regUser').focus();
      } else {
        regTab.classList.remove('active');
        loginTab.classList.add('active');
        regForm.style.display = 'none';
        loginForm.style.display = 'grid';
        if (loginUserInput.value) {
          loginPassInput.focus();
        } else {
          loginUserInput.focus();
        }
      }
    }

    // Client-side password confirmation check
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      const p1 = document.getElementById('regPass').value;
      const p2 = document.getElementById('regPassConfirm').value;
      if (p1 !== p2) {
        e.preventDefault();
        showAlert('Passwords do not match.', 'error');
      }
    });

    function showAlert(msg, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = 'alert ' + type;
      alertBox.textContent = msg;
    }

    // Handle URL query parameters for feedback
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
      showAlert(urlParams.get('error'), 'error');
    } else if (urlParams.has('success')) {
      showAlert(urlParams.get('success'), 'success');
    }
  </script>
</body>
</html>
